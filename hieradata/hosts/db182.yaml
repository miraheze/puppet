mariadb::config::innodb_buffer_pool_size: '18G'
http_proxy: 'http://bastion.fsslc.wtnet:8080'
role::db::backup_sql: false
role::db::enable_bin_logs: false
mariadb::version: '11.8'
role::db::enable_ssl: false
role::db::is_beta_db: false
role::db::wait_timeout: 28800
# https://matomo.org/faq/on-premise/how-to-configure-matomo-for-speed/#configure-your-database-server-for-speed
mariadb::config::flush_log_at_trx_commit: '2'
base::dns::do_ipv4: true
base::dns::do_ipv6: false
base::dns::forward_use_internal: true
