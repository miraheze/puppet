http_proxy: 'http://bastion.fsslc.wtnet:8080'

role::opensearch::roles: ['data', 'ingest']
role::opensearch::discovery_host:
  - os162.fsslc.wtnet
  - os202.fsslc.wtnet
role::opensearch::manager_hosts:
  - os162
opensearch::api_host: os162.fsslc.wtnet

base::syslog::rsyslog_udp_localhost: true

base::dns::do_ipv4: true
base::dns::forward_use_internal: true

opensearch::proxy_url: 'http://bastion.fsslc.wtnet:8080'

opensearch::plugins:
  analysis-icu: {}
  analysis-nori: {}
  analysis-smartcn: {}
  analysis-stempel: {}
  analysis-ukrainian: {}
  analysis-sudachi:
    url: 'https://github.com/WorksApplications/elasticsearch-sudachi/releases/download/v3.6.0/opensearch-2.19.4-analysis-sudachi-3.6.0.zip'
