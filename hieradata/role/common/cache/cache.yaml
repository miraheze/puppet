users::groups: 'cache-admins'
varnish::cache_file_size: '345G'
varnish::interval_check: '10s'
varnish::interval_timeout: '10s'
varnish::thread_pool_max: 12000
varnish::transient_storage: 5
role::cache::cache::restrict_firewall: true

role::cache::haproxy::cache_backends:
  cp161: 10.0.16.137
  cp171: 10.0.17.138
  cp191: 10.0.19.146
  cp201: 10.0.20.166

role::cache::haproxy::lb_pools:
