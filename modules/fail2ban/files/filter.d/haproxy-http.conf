# Fail2ban filter for the HAProxy TLS terminator access log.
# Needs extended_logging so that remote_addr is present.
# The status list is overridable from the jail, see statuses below.

[Definition]
failregex = \bhttp_status=(?:<statuses>) response_size=-?\d+ remote_addr=<ADDR>\s
ignoreregex =

[Init]
statuses = 403|429
